<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Praise Prototype</title>
    <style>
      :root {
        --ink: #27312f;
        --muted: #687370;
        --line: rgba(39, 49, 47, 0.12);
        --paper: #fffdf8;
        --cream: #fbf5e8;
        --mint: #d8efe5;
        --sage: #83a896;
        --coral: #ee8f73;
        --sun: #f4c95d;
        --blue: #8db5c9;
        --shadow: 0 28px 80px rgba(53, 71, 65, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 940px;
        background:
          radial-gradient(circle at 9% 15%, rgba(238, 143, 115, 0.22), transparent 24rem),
          radial-gradient(circle at 86% 20%, rgba(141, 181, 201, 0.32), transparent 26rem),
          linear-gradient(145deg, #fffaf0 0%, #eff8ef 45%, #f7fbff 100%);
      }

      body {
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .prototype-board {
        min-height: 940px;
        padding: 42px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 28px;
        align-items: center;
      }

      .frame {
        position: relative;
        overflow: hidden;
        background:
          linear-gradient(125deg, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.5)),
          linear-gradient(145deg, #fff8ea 0%, #e5f5ea 52%, #f4f9ff 100%);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: var(--shadow);
      }

      .desktop {
        min-height: 780px;
        border-radius: 34px;
      }

      .phone-shell {
        padding: 12px;
        border-radius: 42px;
        background: rgba(40, 47, 44, 0.86);
        box-shadow: 0 24px 70px rgba(40, 47, 44, 0.24);
      }

      .mobile {
        min-height: 716px;
        border-radius: 32px;
      }

      .app {
        position: relative;
        isolation: isolate;
        min-height: inherit;
        padding: 38px;
      }

      .desktop .app {
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .mobile .app {
        padding: 28px 22px;
        display: flex;
        flex-direction: column;
      }

      .glow,
      .glow::before,
      .glow::after {
        position: absolute;
        content: "";
        pointer-events: none;
        border-radius: 999px;
        filter: blur(2px);
      }

      .glow {
        inset: 0;
        z-index: -1;
      }

      .glow::before {
        width: 360px;
        height: 360px;
        left: -110px;
        top: 120px;
        background: rgba(244, 201, 93, 0.24);
      }

      .glow::after {
        width: 420px;
        height: 420px;
        right: -145px;
        bottom: -120px;
        background: rgba(131, 168, 150, 0.24);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 16px;
        color: #fffdf8;
        font-size: 20px;
        font-weight: 800;
        background: linear-gradient(145deg, var(--coral), var(--sun));
        box-shadow: 0 12px 24px rgba(238, 143, 115, 0.3);
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .date-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 0 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #46524f;
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(16px);
        font-size: 13px;
        white-space: nowrap;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--sage);
        box-shadow: 0 0 0 4px rgba(131, 168, 150, 0.16);
      }

      .hero {
        display: grid;
        place-items: center;
        padding: 28px 0 24px;
      }

      .praise-card {
        position: relative;
        width: min(720px, 100%);
        padding: 58px 58px 42px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.76);
        border-radius: 28px;
        background: rgba(255, 253, 248, 0.72);
        box-shadow:
          0 26px 64px rgba(57, 73, 68, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(22px);
      }

      .praise-card::before {
        position: absolute;
        content: "";
        inset: 0;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.64), rgba(255, 255, 255, 0)),
          radial-gradient(circle at 85% 15%, rgba(244, 201, 93, 0.2), transparent 9rem);
        opacity: 0.7;
      }

      .sparkle {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--sun);
        box-shadow:
          28px 34px 0 rgba(238, 143, 115, 0.7),
          82px -8px 0 rgba(141, 181, 201, 0.65),
          194px 62px 0 rgba(131, 168, 150, 0.65);
      }

      .sparkle.one {
        right: 86px;
        top: 50px;
      }

      .sparkle.two {
        left: 50px;
        bottom: 54px;
        transform: scale(0.65);
      }

      .style-tag {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        min-height: 34px;
        padding: 0 13px;
        border: 1px solid rgba(131, 168, 150, 0.24);
        border-radius: 999px;
        color: #50625b;
        background: rgba(216, 239, 229, 0.5);
        font-size: 13px;
        font-weight: 700;
      }

      .quote {
        position: relative;
        margin: 26px 0 30px;
        max-width: 620px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(32px, 5vw, 58px);
        line-height: 1.04;
        letter-spacing: 0;
      }

      .source-row {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        color: var(--muted);
      }

      .source {
        font-size: 15px;
      }

      .mini-meter {
        display: grid;
        grid-template-columns: repeat(5, 26px);
        gap: 6px;
      }

      .mini-meter span {
        height: 7px;
        border-radius: 999px;
        background: rgba(39, 49, 47, 0.12);
      }

      .mini-meter span:nth-child(-n + 4) {
        background: linear-gradient(90deg, var(--sage), var(--sun));
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      button,
      .chip {
        min-height: 46px;
        border: 0;
        font: inherit;
        cursor: default;
      }

      .primary-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 22px;
        border-radius: 999px;
        color: #fffdf8;
        background: #2f4d43;
        box-shadow: 0 16px 36px rgba(47, 77, 67, 0.28);
        font-weight: 800;
      }

      .primary-button .icon {
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
      }

      .style-switcher {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.48);
        backdrop-filter: blur(18px);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 15px;
        border-radius: 999px;
        color: #52605d;
        background: transparent;
        font-size: 14px;
        font-weight: 700;
      }

      .chip.active {
        color: #23312d;
        background: #fffdf8;
        box-shadow: 0 8px 18px rgba(57, 73, 68, 0.1);
      }

      .mobile .topbar {
        align-items: flex-start;
      }

      .mobile .date-pill {
        display: none;
      }

      .mobile h1 {
        font-size: 22px;
      }

      .mobile .hero {
        flex: 1;
        display: flex;
        align-items: center;
        padding: 54px 0 32px;
      }

      .mobile .praise-card {
        padding: 38px 26px 28px;
        border-radius: 24px;
      }

      .mobile .quote {
        margin: 22px 0 28px;
        font-size: 38px;
        line-height: 1.06;
      }

      .mobile .source-row {
        display: block;
      }

      .mobile .mini-meter {
        margin-top: 18px;
      }

      .mobile .controls {
        align-items: stretch;
        gap: 12px;
      }

      .mobile .primary-button,
      .mobile .style-switcher {
        width: 100%;
      }

      .mobile .style-switcher {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        border-radius: 22px;
      }

      .mobile .chip {
        padding: 0 8px;
      }

      @media (max-width: 980px) {
        .prototype-board {
          grid-template-columns: 1fr;
          padding: 20px;
        }

        .phone-shell {
          width: min(390px, 100%);
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="prototype-board" aria-label="Daily Praise high fidelity prototype">
      <section class="frame desktop" aria-label="Desktop prototype">
        <div class="app">
          <div class="glow"></div>

          <header class="topbar">
            <div class="brand">
              <div class="brand-mark">D</div>
              <div>
                <h1>Daily Praise</h1>
                <p class="subtitle">A tiny compliment for your day.</p>
              </div>
            </div>
            <div class="date-pill"><span class="dot"></span> Friday, May 8</div>
          </header>

          <section class="hero">
            <article class="praise-card">
              <span class="sparkle one"></span>
              <span class="sparkle two"></span>
              <div class="style-tag"><span class="dot"></span> Warm style</div>
              <p class="quote">You make ordinary moments feel quietly brighter.</p>
              <div class="source-row">
                <div class="source">Today's small lift</div>
                <div class="mini-meter" aria-hidden="true">
                  <span></span>
                  <span></span>
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
              </div>
            </article>
          </section>

          <footer class="controls">
            <button class="primary-button" type="button">
              <span class="icon">+</span>
              Another one
            </button>
            <div class="style-switcher" aria-label="Praise style">
              <button class="chip active" type="button">Warm</button>
              <button class="chip" type="button">Pro</button>
              <button class="chip" type="button">Funny</button>
              <button class="chip" type="button">Smart</button>
            </div>
          </footer>
        </div>
      </section>

      <div class="phone-shell" aria-label="Mobile device frame">
        <section class="frame mobile" aria-label="Mobile prototype">
          <div class="app">
            <div class="glow"></div>

            <header class="topbar">
              <div class="brand">
                <div class="brand-mark">D</div>
                <div>
                  <h1>Daily Praise</h1>
                  <p class="subtitle">A tiny compliment for your day.</p>
                </div>
              </div>
            </header>

            <section class="hero">
              <article class="praise-card">
                <span class="sparkle one"></span>
                <span class="sparkle two"></span>
                <div class="style-tag"><span class="dot"></span> Warm style</div>
                <p class="quote">You bring a steady kind of good energy.</p>
                <div class="source-row">
                  <div class="source">Today's small lift</div>
                  <div class="mini-meter" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                  </div>
                </div>
              </article>
            </section>

            <footer class="controls">
              <button class="primary-button" type="button">
                <span class="icon">+</span>
                Another one
              </button>
              <div class="style-switcher" aria-label="Praise style">
                <button class="chip active" type="button">Warm</button>
                <button class="chip" type="button">Pro</button>
                <button class="chip" type="button">Funny</button>
                <button class="chip" type="button">Smart</button>
              </div>
            </footer>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
