<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="夸夸每天送你一句中文赞美和一首轻快音乐，给今天一点轻轻的能量。"
    />
    <title>夸夸</title>
    <link rel="stylesheet" href="./style.css?v=20260511-v202-register-bonus-fix" />
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <div class="glow" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand" href="./index.html" aria-label="夸夸首页">
          <span class="brand-mark" aria-hidden="true">夸</span>
          <span>
            <h1 id="app-title">夸夸</h1>
            <span class="subtitle">给今天一点轻轻的能量</span>
          </span>
        </a>

        <div class="top-actions" aria-label="会员状态">
          <div class="date-pill" aria-label="今天">
            <span class="dot" aria-hidden="true"></span>
            <span id="todayLabel">今天</span>
          </div>
          <div class="quota-pill" id="quotaPill" aria-live="polite">次数加载中</div>
          <button
            class="login-button"
            id="loginButton"
            type="button"
            data-analytics-event="login_button_click"
          >
            登录
          </button>
        </div>
      </header>

      <section class="hero" aria-live="polite">
        <article class="praise-card" id="praiseCard">
          <span class="sparkle sparkle-one" aria-hidden="true"></span>
          <span class="sparkle sparkle-two" aria-hidden="true"></span>

          <div class="style-tag">
            <span class="dot" aria-hidden="true"></span>
            <span id="styleLabel">温暖型</span>
          </div>

          <p class="quote" id="quoteText"></p>

          <div class="music-panel">
            <button
              class="music-button"
              id="musicButton"
              type="button"
              data-analytics-event="music_play_click"
              aria-label="播放音乐"
            >
              <span id="musicButtonIcon" aria-hidden="true">▶</span>
            </button>
            <div class="music-copy">
              <span class="music-label">今日轻音乐</span>
              <strong id="musicTitle"></strong>
              <span id="musicMood"></span>
            </div>
            <div class="music-wave" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>

          <audio id="musicPlayer" preload="metadata" loop></audio>
        </article>
      </section>

      <footer class="controls" aria-label="夸夸控制区">
        <button
          class="primary-button"
          id="nextButton"
          type="button"
          data-analytics-event="praise_next_click"
        >
          <span class="button-icon" aria-hidden="true">↻</span>
          换一句
        </button>

        <div class="style-switcher" role="group" aria-label="选择赞美风格">
          <button
            class="chip active"
            type="button"
            data-style="warm"
            data-analytics-event="praise_style_click"
            aria-pressed="true"
          >
            温暖
          </button>
          <button
            class="chip"
            type="button"
            data-style="professional"
            data-analytics-event="praise_style_click"
            aria-pressed="false"
          >
            专业
          </button>
          <button
            class="chip"
            type="button"
            data-style="funny"
            data-analytics-event="praise_style_click"
            aria-pressed="false"
          >
            幽默
          </button>
          <button
            class="chip"
            type="button"
            data-style="smart"
            data-analytics-event="praise_style_click"
            aria-pressed="false"
          >
            助眠曲
          </button>
        </div>
      </footer>
    </main>

    <div class="login-modal" id="loginModal" hidden>
      <div class="modal-backdrop" data-close-login></div>
      <section
        class="login-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="loginTitle"
        aria-describedby="loginDescription"
      >
        <button class="modal-close" type="button" data-close-login aria-label="关闭登录弹窗">
          ×
        </button>
        <div class="login-mark" aria-hidden="true">夸</div>
        <h2 id="loginTitle">登录后继续被夸</h2>
        <p id="loginDescription">
          已注册手机号可直接登录。首次使用请先注册，注册后会额外获得 10 次夸夸次数。
        </p>
        <button class="auth-mode-button" id="authModeButton" type="button">
          首次使用？切换到注册
        </button>

        <form class="login-form" id="loginForm">
          <label>
            手机号
            <input
              id="phoneInput"
              type="tel"
              inputmode="numeric"
              autocomplete="tel"
              placeholder="请输入 11 位手机号"
              maxlength="11"
            />
          </label>

          <label>
            验证码
            <div class="code-row">
              <input
                id="codeInput"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="6 位验证码"
                maxlength="8"
              />
              <button class="code-button" id="sendCodeButton" type="button">
                获取验证码
              </button>
            </div>
          </label>

          <p class="form-message" id="loginMessage" aria-live="polite"></p>

          <button class="login-submit" id="loginSubmitButton" type="submit">登录</button>
        </form>

        <div class="login-success" id="loginSuccess" hidden>
          <strong id="loginSuccessTitle">登录成功</strong>
          <p id="loginSuccessText">已领取夸夸次数，可以继续换一句了。</p>
          <button class="login-submit" id="loginContinueButton" type="button">
            返回夸夸
          </button>
        </div>
      </section>
    </div>

    <div class="status-toast" id="statusToast" hidden aria-live="polite"></div>

    <script src="./analytics-config.js?v=20260511-v202-register-bonus-fix"></script>
    <script src="./membership-config.js?v=20260511-v202-register-bonus-fix"></script>
    <script src="./script.js?v=20260511-v202-register-bonus-fix"></script>
  </body>
</html>
