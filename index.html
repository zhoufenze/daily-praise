<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="夸夸每天送你一句中文赞美和一首轻快音乐，给今天一点轻轻的能量。"
    />
    <title>夸夸</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <div class="glow" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand" href="./index.html" aria-label="夸夸首页">
          <span class="brand-mark" aria-hidden="true">夸</span>
          <span>
            <h1 id="app-title">夸夸</h1>
            <span class="subtitle">给今天一点轻轻的能量</span>
          </span>
        </a>

        <div class="date-pill" aria-label="今天">
          <span class="dot" aria-hidden="true"></span>
          <span id="todayLabel">今天</span>
        </div>
      </header>

      <section class="hero" aria-live="polite">
        <article class="praise-card" id="praiseCard">
          <span class="sparkle sparkle-one" aria-hidden="true"></span>
          <span class="sparkle sparkle-two" aria-hidden="true"></span>

          <div class="style-tag">
            <span class="dot" aria-hidden="true"></span>
            <span id="styleLabel">温暖型</span>
          </div>

          <p class="quote" id="quoteText"></p>

          <div class="music-panel">
            <button
              class="music-button"
              id="musicButton"
              type="button"
              data-analytics-event="music_play_click"
              aria-label="播放音乐"
            >
              <span id="musicButtonIcon" aria-hidden="true">▶</span>
            </button>
            <div class="music-copy">
              <span class="music-label">今日轻音乐</span>
              <strong id="musicTitle"></strong>
              <span id="musicMood"></span>
            </div>
            <div class="music-wave" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>

          <audio id="musicPlayer" preload="metadata" loop></audio>
        </article>
      </section>

      <footer class="controls" aria-label="夸夸控制区">
        <button
          class="primary-button"
          id="nextButton"
          type="button"
          data-analytics-event="praise_next_click"
        >
          <span class="button-icon" aria-hidden="true">↻</span>
          换一句
        </button>

        <div class="style-switcher" role="group" aria-label="选择赞美风格">
          <button
            class="chip active"
            type="button"
            data-style="warm"
            data-analytics-event="praise_style_click"
            aria-pressed="true"
          >
            温暖
          </button>
          <button
            class="chip"
            type="button"
            data-style="professional"
            data-analytics-event="praise_style_click"
            aria-pressed="false"
          >
            专业
          </button>
          <button
            class="chip"
            type="button"
            data-style="funny"
            data-analytics-event="praise_style_click"
            aria-pressed="false"
          >
            幽默
          </button>
          <button
            class="chip"
            type="button"
            data-style="smart"
            data-analytics-event="praise_style_click"
            aria-pressed="false"
          >
            高情商
          </button>
        </div>
      </footer>
    </main>

    <script src="./analytics-config.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
